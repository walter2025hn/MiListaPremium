name: Actualizar lista Código Master

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-lista-m3u
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Combinar y comprobar un lote de 3000 enlaces
        env:
          M3U_SOURCE_1: ${{ secrets.M3U_SOURCE_1 }}
          M3U_SOURCE_2: ${{ secrets.M3U_SOURCE_2 }}
          M3U_SOURCE_3: ${{ secrets.M3U_SOURCE_3 }}
        run: python update_playlist.py

      - name: Publicar lista, reporte y progreso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Completa.m3u reporte_enlaces.txt verificacion_estado.json
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "Actualizar lista M3U: lote de 3000 enlaces"
            git push
          fi

          CURSOR=$(python -c "import json; print(json.load(open('verificacion_estado.json', encoding='utf-8'))['cursor'])")
          if [ "$CURSOR" -ne 0 ]; then
            echo "Lote publicado. Se inicia automáticamente el siguiente lote."
            gh workflow run update-playlist.yml --ref main
          else
            echo "Ciclo completo: todos los enlaces únicos han sido revisados."
          fi
