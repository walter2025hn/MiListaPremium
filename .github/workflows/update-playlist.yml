name: Actualizar lista Código Master

on:
  push:
    branches: [main]
    paths:
      - "update_playlist.py"
      - "maintain_links.py"
      - "build_catalog_pages.py"
      - ".github/workflows/update-playlist.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      add_batch:
        description: "Incorporar una tanda de hasta 50 canales, 50 películas y 50 series verificadas"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-lista-m3u
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guardar copia de seguridad temporal
        run: cp Completa.m3u /tmp/Completa.m3u.before

      - name: Incorporar tanda solicitada
        if: github.event_name == 'workflow_dispatch' && inputs.add_batch == true
        env:
          M3U_SOURCE_1: ${{ secrets.M3U_SOURCE_1 }}
          M3U_SOURCE_2: ${{ secrets.M3U_SOURCE_2 }}
          M3U_SOURCE_3: ${{ secrets.M3U_SOURCE_3 }}
        run: python update_playlist.py

      - name: Mantener y reparar enlaces existentes
        env:
          M3U_SOURCE_1: ${{ secrets.M3U_SOURCE_1 }}
          M3U_SOURCE_2: ${{ secrets.M3U_SOURCE_2 }}
          M3U_SOURCE_3: ${{ secrets.M3U_SOURCE_3 }}
        run: python maintain_links.py

      - name: Generar páginas del catálogo al finalizar la revisión
        run: |
          MAINT_CURSOR=$(python -c "import json, pathlib; p=pathlib.Path('mantenimiento_estado.json'); print(json.loads(p.read_text(encoding='utf-8')).get('cursor', 0) if p.exists() else 0)")
          if [ "$MAINT_CURSOR" -eq 0 ]; then
            python build_catalog_pages.py
          else
            echo "Se generarán las páginas cuando termine la revisión de todos los lotes."
          fi

      - name: Guardar respaldo de la lista anterior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-Completa-M3U-${{ github.run_number }}
          path: /tmp/Completa.m3u.before
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar lista, cola, reportes y progreso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Completa.m3u contenido_pendiente.m3u reporte_enlaces.txt verificacion_estado.json reporte_mantenimiento.txt mantenimiento_estado.json catalog_pages/
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "Actualizar lista M3U y cola de contenido pendiente"
            git pull --rebase origin main
            git push
          fi

          MAINT_CURSOR=$(python -c "import json, pathlib; p=pathlib.Path('mantenimiento_estado.json'); print(json.loads(p.read_text(encoding='utf-8')).get('cursor', 0) if p.exists() else 0)")
          if [ "$MAINT_CURSOR" -ne 0 ]; then
            echo "Quedan lotes de mantenimiento pendientes. Se continúa sin incorporar contenido nuevo."
            gh workflow run update-playlist.yml --ref main
          else
            echo "Mantenimiento completado."
          fi
