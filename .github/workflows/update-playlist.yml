name: Actualizar lista Código Master

on:
  push:
    branches: [main]
    paths:
      - "update_playlist.py"
      - "maintain_links.py"
      - ".github/workflows/update-playlist.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-lista-m3u
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guardar copia de seguridad temporal
        run: cp Completa.m3u /tmp/Completa.m3u.before

      - name: Combinar, limpiar y reparar enlaces autorizados
        env:
          M3U_SOURCE_1: ${{ secrets.M3U_SOURCE_1 }}
          M3U_SOURCE_2: ${{ secrets.M3U_SOURCE_2 }}
          M3U_SOURCE_3: ${{ secrets.M3U_SOURCE_3 }}
        run: |
          python update_playlist.py
          python maintain_links.py
          python build_catalog_pages.py

      - name: Guardar respaldo de la lista anterior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-Completa-M3U-${{ github.run_number }}
          path: /tmp/Completa.m3u.before
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar lista, reporte y progreso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Completa.m3u reporte_enlaces.txt verificacion_estado.json reporte_mantenimiento.txt mantenimiento_estado.json catalog_pages/
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "Actualizar lista M3U: lote de 3000 enlaces"
            # Integrate commits added to main after this runner checked out the repo.
            # This avoids non-fast-forward failures when workflow/code changes land mid-run.
            git pull --rebase origin main
            git push
          fi

          CURSOR=$(python -c "import json; print(json.load(open('verificacion_estado.json', encoding='utf-8'))['cursor'])")
          if [ "$CURSOR" -ne 0 ]; then
            echo "Lote publicado. Se inicia automáticamente el siguiente lote."
            gh workflow run update-playlist.yml --ref main
          else
            echo "Ciclo completo: todos los enlaces únicos han sido revisados."
          fi
